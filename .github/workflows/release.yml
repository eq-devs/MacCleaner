# Push a tag like v1.0.0 to build the app and publish it as a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          plutil -replace CFBundleShortVersionString -string "${GITHUB_REF_NAME#v}" Info.plist
          ./build.sh dist
          ln -s /Applications dist/Applications
          # hdiutil sometimes fails with "Resource busy" on GitHub runners, so retry
          for i in 1 2 3; do
            hdiutil create -volname "Mac Cleaner" -srcfolder dist -ov -format UDZO MacCleaner.dmg && break
            sleep 5
          done
          test -f MacCleaner.dmg

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" MacCleaner.dmg --generate-notes --notes "Open **MacCleaner.dmg** and drag **Mac Cleaner** onto **Applications**.

          The app is not notarized by Apple, so macOS blocks the first open. To allow it, try to open it once, then go to System Settings → Privacy & Security and click **Open Anyway**. Or run:
          \`\`\`
          xattr -dr com.apple.quarantine \"/Applications/Mac Cleaner.app\"
          \`\`\`

          Apple Silicon (M1 or newer), macOS 14+."
